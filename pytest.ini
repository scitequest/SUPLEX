[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .tox dist build *.egg __pycache__ docs notebooks suplex_elements modules .ipynb_checkpoints

addopts = 
    -v
    --tb=short
    --strict-markers
    --durations=10
    --cov=martin_interface
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --showlocals
    --capture=no
    -W default
    --color=yes

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    validation: marks tests for validation functions
    adapter: marks tests for adapter functionality
    dataset: marks tests for dataset processing
    search: marks tests for directory search
    requires_files: marks tests that require real files
    requires_notebook: marks tests for jupyter notebooks
    skip_ci: marks tests to skip in CI/CD

minversion = 3.8

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

log_cli = false
log_cli_level = INFO

console_output_style = progress