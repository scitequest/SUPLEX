[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suplex"
version = "0.1.0"
description = "Ihre Projektbeschreibung"
authors = [
    {name = "Kai Oliver Kreissner"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ipywidgets",
    "jupyter",
    # add other dependencies later
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"