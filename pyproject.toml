[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "suplex"
version = "0.4.0"
description = "SUPLEX - Analysis platform for MARTin microarray data with modular visualization and processing tools"
authors = [{ name = "Kai Oliver Kreissner" }]
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["microarray", "martin", "data-analysis", "visualization", "heatmap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "ipyevents>=2.0",
    "ipyfilechooser>=0.6",
    "ipykernel>=6.29",
    "ipywidgets>=8.0",
    "isodate>=0.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=10.0",
    "platformdirs>=4.0",
    "pyperclip>=1.8",
    "scipy>=1.11",
    "seaborn>=0.13",
    "svgutils>=0.3",
    "typing_extensions>=4.0",
    "voila>=0.5",
]

[project.scripts]
suplex = "suplex.cli:main"

[project.urls]
Homepage = "https://github.com/scitequest/SUPLEX"
Repository = "https://github.com/scitequest/SUPLEX"
Issues = "https://github.com/scitequest/SUPLEX/issues"

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.5",
]
build = ["pyinstaller>=6.0"]

[tool.uv.build-backend]
source-exclude = ["**/__pycache__", "**/.ipynb_checkpoints"]
wheel-exclude = ["**/__pycache__", "**/.ipynb_checkpoints"]

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    ".git", ".tox", "dist", "build", "*.egg", "__pycache__", "docs",
    "notebooks", "suplex_elements", "modules", ".ipynb_checkpoints",
]
addopts = """
    -v
    --tb=short
    --strict-markers
    --durations=10
    --cov=suplex
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --showlocals
    --capture=no
    -W default
    --color=yes
"""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fast: marks tests as fast",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "validation: marks tests for validation functions",
    "adapter: marks tests for adapter functionality",
    "dataset: marks tests for dataset processing",
    "search: marks tests for directory search",
    "requires_files: marks tests that require real files",
    "requires_notebook: marks tests for jupyter notebooks",
    "skip_ci: marks tests to skip in CI/CD",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
log_cli = false
log_cli_level = "DEBUG"
console_output_style = "progress"

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["suplex"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# =============================================================================
# Code Quality Tools
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/test_data"]  # deliberately broken fixture modules

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",  # line too long (handled by the formatter)
    # Pre-existing findings kept out of CI for now; clean up separately.
    "E711",  # comparison to None
    "E712",  # comparison to True/False
    "E721",  # type comparison with ==
    "F403",  # star imports
    "F405",  # names from star imports
    "F841",  # unused local variables
]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from another conftest are "redefined" when used as parameters.
"tests/end_to_end/conftest.py" = ["F811"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
